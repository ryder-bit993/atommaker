<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AtomMaker — Bohr Model & Molecular Visualizer</title>
  <style>
    :root {
      --bg-dark: #090a10;
      --panel-bg: rgba(22, 26, 38, 0.92);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-gold: #f59e0b;
      --accent-magenta: #ec4899;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* HEADER */
    header {
      height: 56px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 20;
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-cyan) 0%, var(--accent-blue) 100%);
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-active {
      background: var(--accent-gold) !important;
      color: #000 !important;
      font-weight: 700;
    }

    select, input[type="text"], input[type="number"] {
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    /* MAIN VIEWPORT */
    #workspace {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* FLOATING SIDE PANEL */
    .floating-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 320px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      z-index: 10;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      max-height: calc(100vh - 100px);
      overflow-y: auto;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      color: var(--accent-cyan);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .input-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .input-row input {
      width: 100%;
      text-align: center;
    }

    .toggle-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    /* AUFBAU PANEL */
    #aufbau-modal {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 380px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      z-index: 10;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      display: none;
    }

    .aufbau-grid {
      display: flex;
      flex-direction: column-reverse;
      gap: 6px;
      margin-top: 10px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .aufbau-level {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .aufbau-label {
      width: 35px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-gold);
      text-align: right;
    }

    .aufbau-boxes {
      display: flex;
      gap: 4px;
    }

    .electron-box {
      width: 22px;
      height: 22px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--accent-cyan);
    }

    .formula-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <div class="brand">
        <div class="brand-icon"></div>
        <span>AtomMaker</span>
      </div>

      <div class="header-controls">
        <button class="btn" id="btn-add-atom">+ Add Atom</button>
        <button class="btn" id="btn-bond-mode">⚡ Bond Mode</button>
        
        <select id="preset-select">
          <option value="">-- Load Molecule --</option>
          <option value="H2O">Water (H₂O)</option>
          <option value="CO2">Carbon Dioxide (CO₂)</option>
          <option value="CH4">Methane (CH₄)</option>
          <option value="NaCl">Salt (NaCl - Ionic)</option>
          <option value="O2">Oxygen Gas (O₂)</option>
        </select>

        <select id="export-bg-select">
          <option value="#090a10">Export BG: Black</option>
          <option value="#ffffff">Export BG: White</option>
          <option value="transparent">Export BG: Transparent</option>
        </select>

        <button class="btn btn-primary" id="btn-export-png">Export PNG</button>
        <button class="btn" id="btn-clear" style="color: #f87171;">Clear</button>
      </div>
    </header>

    <div id="workspace">
      <canvas id="atomCanvas"></canvas>

      <div class="formula-badge" id="formula-badge">Formula: -</div>

      <!-- SIDEBAR CONTROLS -->
      <div class="floating-panel">
        <div class="panel-title">
          <span>Selected Atom</span>
          <span id="selected-symbol" style="color: var(--accent-gold);">None</span>
        </div>

        <div class="form-group">
          <label>Element Preset</label>
          <select id="element-quick-select">
            <option value="1">1 - Hydrogen (H)</option>
            <option value="6" selected>6 - Carbon (C)</option>
            <option value="7">7 - Nitrogen (N)</option>
            <option value="8">8 - Oxygen (O)</option>
            <option value="11">11 - Sodium (Na)</option>
            <option value="17">17 - Chlorine (Cl)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Particles (Protons / Neutrons / Electrons)</label>
          <div class="input-row">
            <div>
              <input type="number" id="input-p" min="1" max="118" value="6" placeholder="P">
            </div>
            <div>
              <input type="number" id="input-n" min="0" max="200" value="6" placeholder="N">
            </div>
            <div>
              <input type="number" id="input-e" min="0" max="118" value="6" placeholder="E">
            </div>
          </div>
        </div>

        <div class="toggle-group">
          <div class="toggle-item">
            <span>Show Orbitals (s, p, d, f)</span>
            <input type="checkbox" id="toggle-orbitals" checked>
          </div>
          <div class="toggle-item">
            <span>Show Aufbau Diagram</span>
            <input type="checkbox" id="toggle-aufbau">
          </div>
        </div>
      </div>

      <!-- AUFBAU DIAGRAM PANEL -->
      <div id="aufbau-modal">
        <div class="panel-title">
          <span>Aufbau Energy Diagram</span>
        </div>
        <div class="aufbau-grid" id="aufbau-grid"></div>
      </div>
    </div>
  </div>

  <script>
    // Element Symbols
    const ELEMENTS = ["","H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar","K","Ca"];

    // Orbital Capacity Config
    const ORBITAL_ORDER = [
      { name: "1s", cap: 2 }, { name: "2s", cap: 2 }, { name: "2p", cap: 6 },
      { name: "3s", cap: 2 }, { name: "3p", cap: 6 }, { name: "4s", cap: 2 },
      { name: "3d", cap: 10 }, { name: "4p", cap: 6 }
    ];

    let atoms = [];
    let bonds = [];
    let selectedAtomId = null;
    let bondSourceId = null;
    let isBondMode = false;

    let canvas, ctx;

    class Atom {
      constructor(x, y, p = 6, n = 6, e = 6) {
        this.id = Math.random().toString(36).substr(2, 9);
        this.x = x;
        this.y = y;
        this.protons = p;
        this.neutrons = n;
        this.electrons = e;
        this.radius = 35;
      }

      getSymbol() {
        return ELEMENTS[this.protons] || `Z=${this.protons}`;
      }

      getShells() {
        let caps = [2, 8, 18, 32, 50];
        let rem = this.electrons;
        let res = [];
        for (let c of caps) {
          if (rem <= 0) break;
          let cnt = Math.min(rem, c);
          res.push(cnt);
          rem -= cnt;
        }
        return res;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById('atomCanvas');
      ctx = canvas.getContext('2d');

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Default Atom
      let defaultAtom = new Atom(canvas.width / 2, canvas.height / 2, 6, 6, 6);
      atoms.push(defaultAtom);
      selectedAtomId = defaultAtom.id;

      setupEvents();
      render();
    });

    function resizeCanvas() {
      canvas.width = document.getElementById('workspace').clientWidth;
      canvas.height = document.getElementById('workspace').clientHeight;
    }

    function setupEvents() {
      let isDragging = false;
      let dragAtom = null;

      canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        let clicked = atoms.find(a => Math.hypot(a.x - mx, a.y - my) < a.radius + 30);

        if (isBondMode && clicked) {
          if (!bondSourceId) {
            bondSourceId = clicked.id;
          } else if (bondSourceId !== clicked.id) {
            // Create bond
            bonds.push({ id1: bondSourceId, id2: clicked.id, type: 'covalent' });
            bondSourceId = null;
            isBondMode = false;
            document.getElementById('btn-bond-mode').classList.remove('btn-active');
          }
          render();
          return;
        }

        if (clicked) {
          selectedAtomId = clicked.id;
          dragAtom = clicked;
          isDragging = true;
          syncSidebar();
        } else {
          selectedAtomId = null;
        }
        render();
      });

      canvas.addEventListener('mousemove', (e) => {
        if (isDragging && dragAtom) {
          const rect = canvas.getBoundingClientRect();
          dragAtom.x = e.clientX - rect.left;
          dragAtom.y = e.clientY - rect.top;
          render();
        }
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
        dragAtom = null;
      });

      // Controls
      document.getElementById('btn-add-atom').addEventListener('click', () => {
        let a = new Atom(canvas.width / 2 + (Math.random() - 0.5) * 100, canvas.height / 2 + (Math.random() - 0.5) * 100, 1, 0, 1);
        atoms.push(a);
        selectedAtomId = a.id;
        syncSidebar();
        render();
      });

      document.getElementById('btn-bond-mode').addEventListener('click', (e) => {
        isBondMode = !isBondMode;
        bondSourceId = null;
        e.target.classList.toggle('btn-active', isBondMode);
      });

      document.getElementById('element-quick-select').addEventListener('change', (e) => {
        let p = parseInt(e.target.value);
        let cur = atoms.find(a => a.id === selectedAtomId);
        if (cur) {
          cur.protons = p;
          cur.neutrons = p;
          cur.electrons = p;
          syncSidebar();
          render();
        }
      });

      ['input-p', 'input-n', 'input-e'].forEach(id => {
        document.getElementById(id).addEventListener('input', () => {
          let cur = atoms.find(a => a.id === selectedAtomId);
          if (cur) {
            cur.protons = parseInt(document.getElementById('input-p').value) || 1;
            cur.neutrons = parseInt(document.getElementById('input-n').value) || 0;
            cur.electrons = parseInt(document.getElementById('input-e').value) || 0;
            render();
          }
        });
      });

      document.getElementById('toggle-orbitals').addEventListener('change', render);
      document.getElementById('toggle-aufbau').addEventListener('change', (e) => {
        document.getElementById('aufbau-modal').style.display = e.target.checked ? 'block' : 'none';
        render();
      });

      document.getElementById('preset-select').addEventListener('change', (e) => {
        loadPreset(e.target.value);
      });

      document.getElementById('btn-clear').addEventListener('click', () => {
        atoms = [];
        bonds = [];
        selectedAtomId = null;
        render();
      });

      document.getElementById('btn-export-png').addEventListener('click', exportPNG);
    }

    function syncSidebar() {
      let cur = atoms.find(a => a.id === selectedAtomId);
      if (!cur) return;
      document.getElementById('selected-symbol').textContent = `${cur.getSymbol()} (Z=${cur.protons})`;
      document.getElementById('input-p').value = cur.protons;
      document.getElementById('input-n').value = cur.neutrons;
      document.getElementById('input-e').value = cur.electrons;
    }

    function loadPreset(type) {
      atoms = [];
      bonds = [];
      let cx = canvas.width / 2;
      let cy = canvas.height / 2;

      if (type === 'H2O') {
        let o = new Atom(cx, cy, 8, 8, 8);
        let h1 = new Atom(cx - 110, cy + 60, 1, 0, 1);
        let h2 = new Atom(cx + 110, cy + 60, 1, 0, 1);
        atoms.push(o, h1, h2);
        bonds.push({ id1: o.id, id2: h1.id }, { id1: o.id, id2: h2.id });
      } else if (type === 'CO2') {
        let c = new Atom(cx, cy, 6, 6, 6);
        let o1 = new Atom(cx - 140, cy, 8, 8, 8);
        let o2 = new Atom(cx + 140, cy, 8, 8, 8);
        atoms.push(c, o1, o2);
        bonds.push({ id1: c.id, id2: o1.id }, { id1: c.id, id2: o2.id });
      } else if (type === 'NaCl') {
        let na = new Atom(cx - 90, cy, 11, 12, 11);
        let cl = new Atom(cx + 90, cy, 17, 18, 17);
        atoms.push(na, cl);
        bonds.push({ id1: na.id, id2: cl.id });
      }
      selectedAtomId = atoms[0]?.id || null;
      syncSidebar();
      render();
    }

    function render(targetCtx = ctx, bgColor = null) {
      let activeCtx = targetCtx;
      let width = activeCtx.canvas.width;
      let height = activeCtx.canvas.height;

      // Draw Background
      if (bgColor === 'transparent') {
        activeCtx.clearRect(0, 0, width, height);
      } else {
        activeCtx.fillStyle = bgColor || '#090a10';
        activeCtx.fillRect(0, 0, width, height);
      }

      let showOrbitals = document.getElementById('toggle-orbitals').checked;

      // Draw Bonds
      for (let b of bonds) {
        let a1 = atoms.find(a => a.id === b.id1);
        let a2 = atoms.find(a => a.id === b.id2);
        if (a1 && a2) {
          activeCtx.beginPath();
          activeCtx.moveTo(a1.x, a1.y);
          activeCtx.lineTo(a2.x, a2.y);
          activeCtx.strokeStyle = '#f59e0b';
          activeCtx.lineWidth = 4;
          activeCtx.setLineDash([]);
          activeCtx.stroke();
        }
      }

      // Draw Atoms
      for (let a of atoms) {
        let isSelected = (a.id === selectedAtomId);
        let shells = a.getShells();

        // Shell Rings
        shells.forEach((cnt, idx) => {
          let r = a.radius + (idx + 1) * 32;
          activeCtx.beginPath();
          activeCtx.arc(a.x, a.y, r, 0, Math.PI * 2);
          activeCtx.strokeStyle = showOrbitals ? 'rgba(6, 182, 212, 0.4)' : 'rgba(255, 255, 255, 0.15)';
          activeCtx.lineWidth = 1.5;
          activeCtx.setLineDash(showOrbitals ? [4, 4] : []);
          activeCtx.stroke();

          // Draw Electrons
          for (let i = 0; i < cnt; i++) {
            let angle = (Math.PI * 2 / cnt) * i - Math.PI / 2;
            let ex = a.x + r * Math.cos(angle);
            let ey = a.y + r * Math.sin(angle);

            activeCtx.beginPath();
            activeCtx.arc(ex, ey, 6, 0, Math.PI * 2);
            activeCtx.fillStyle = '#38bdf8';
            activeCtx.shadowColor = '#38bdf8';
            activeCtx.shadowBlur = 8;
            activeCtx.fill();
            activeCtx.shadowBlur = 0;
          }
        });

        // Nucleus
        activeCtx.beginPath();
        activeCtx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
        activeCtx.fillStyle = isSelected ? '#1e293b' : '#0f172a';
        activeCtx.strokeStyle = isSelected ? '#f59e0b' : '#38bdf8';
        activeCtx.lineWidth = isSelected ? 3 : 2;
        activeCtx.fill();
        activeCtx.stroke();

        // Text inside Nucleus
        activeCtx.fillStyle = '#f43f5e';
        activeCtx.font = 'bold 12px sans-serif';
        activeCtx.textAlign = 'center';
        activeCtx.fillText(`${a.protons}p⁺`, a.x, a.y - 4);

        activeCtx.fillStyle = '#38bdf8';
        activeCtx.fillText(`${a.neutrons}n⁰`, a.x, a.y + 12);
      }

      updateAufbau();
      updateFormula();
    }

    function updateFormula() {
      if (atoms.length === 0) {
        document.getElementById('formula-badge').textContent = 'Formula: -';
        return;
      }
      let counts = {};
      atoms.forEach(a => {
        let sym = a.getSymbol();
        counts[sym] = (counts[sym] || 0) + 1;
      });
      let str = Object.entries(counts).map(([s, c]) => `${s}${c > 1 ? c : ''}`).join('');
      document.getElementById('formula-badge').textContent = `Formula: ${str}`;
    }

    function updateAufbau() {
      let cur = atoms.find(a => a.id === selectedAtomId);
      let container = document.getElementById('aufbau-grid');
      container.innerHTML = '';
      if (!cur) return;

      let rem = cur.electrons;
      ORBITAL_ORDER.forEach(orb => {
        if (rem <= 0) return;
        let placed = Math.min(rem, orb.cap);
        rem -= placed;

        let row = document.createElement('div');
        row.className = 'aufbau-level';

        let label = document.createElement('div');
        label.className = 'aufbau-label';
        label.textContent = orb.name;

        let boxes = document.createElement('div');
        boxes.className = 'aufbau-boxes';

        let numBoxes = orb.cap / 2;
        for (let b = 0; b < numBoxes; b++) {
          let box = document.createElement('div');
          box.className = 'electron-box';
          let eInBox = Math.min(placed - b * 2, 2);
          if (eInBox === 2) box.textContent = '↿⇂';
          else if (eInBox === 1) box.textContent = '↿';
          boxes.appendChild(box);
        }

        row.appendChild(label);
        row.appendChild(boxes);
        container.appendChild(row);
      });
    }

    function exportPNG() {
      let bg = document.getElementById('export-bg-select').value;
      let expCanvas = document.createElement('canvas');
      expCanvas.width = canvas.width;
      expCanvas.height = canvas.height;
      let expCtx = expCanvas.getContext('2d');

      render(expCtx, bg);

      let link = document.createElement('a');
      link.download = 'bohr-atom-model.png';
      link.href = expCanvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
