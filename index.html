<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AtomMaker — Interactive Bohr Model, Bonding & Video Recorder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #090a10;
      --panel-bg: rgba(18, 22, 34, 0.92);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-gold: #f59e0b;
      --accent-rose: #f43f5e;
      --text-main: #f3f4f6;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .glass-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
    }

    .pt-element {
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .pt-element:hover {
      transform: scale(1.15);
      z-index: 30;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    @keyframes pulse-record {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    .recording-dot {
      animation: pulse-record 1s infinite ease-in-out;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col select-none">

  <!-- HEADER NAVIGATION -->
  <header class="h-14 glass-panel border-b z-20 flex items-center justify-between px-4">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 shadow-lg shadow-cyan-500/30 flex items-center justify-center font-bold text-white text-sm">
        <i class="fa-solid fa-atom"></i>
      </div>
      <span class="font-bold text-lg tracking-tight text-white">AtomMaker</span>
    </div>

    <!-- MAIN TOOLBAR -->
    <div class="flex items-center gap-2">
      <button id="btn-open-pt" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-semibold flex items-center gap-2 transition">
        <i class="fa-solid fa-table-cells"></i> Periodic Table
      </button>

      <button id="btn-add-atom" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-plus text-cyan-400"></i> Add Atom
      </button>

      <div class="h-5 w-px bg-slate-700 mx-1"></div>

      <!-- BONDING TOGGLES -->
      <button id="btn-bond-covalent" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-link text-amber-400"></i> Covalent Bond
      </button>

      <button id="btn-bond-ionic" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-bolt text-pink-400"></i> Ionic Bond
      </button>

      <div class="h-5 w-px bg-slate-700 mx-1"></div>

      <!-- ANIMATION & VIDEO CONTROLS -->
      <button id="btn-play-pause" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-pause text-emerald-400" id="play-icon"></i>
      </button>

      <button id="btn-record-video" class="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-xs font-semibold flex items-center gap-2 transition">
        <span class="w-2.5 h-2.5 rounded-full bg-white recording-dot hidden" id="rec-dot"></span>
        <i class="fa-solid fa-video" id="rec-icon"></i>
        <span id="rec-text">Record Video</span>
      </button>

      <div class="h-5 w-px bg-slate-700 mx-1"></div>

      <!-- EXPORT OPTIONS -->
      <select id="export-bg-select" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-2 py-1.5 outline-none">
        <option value="#090a10">BG: Black</option>
        <option value="#ffffff">BG: White</option>
        <option value="transparent">BG: Transparent</option>
      </select>

      <button id="btn-export-png" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-file-image text-cyan-400"></i> PNG
      </button>

      <button id="btn-clear" class="px-3 py-1.5 rounded-lg bg-red-950/60 hover:bg-red-900/80 border border-red-800 text-xs font-medium text-red-300 transition">
        Clear
      </button>
    </div>
  </header>

  <!-- WORKSPACE -->
  <div class="flex-1 relative overflow-hidden" id="workspace">
    <canvas id="atomCanvas" class="w-full h-full block cursor-crosshair"></canvas>

    <!-- MOLECULE FORMULA BADGE -->
    <div class="absolute top-4 right-4 glass-panel px-4 py-2 rounded-full font-bold text-sm text-cyan-300 shadow-xl border border-cyan-500/30 flex items-center gap-2">
      <i class="fa-solid fa-flask text-amber-400"></i>
      <span id="formula-badge">Formula: -</span>
    </div>

    <!-- SIDEBAR CONTROLS -->
    <div class="absolute top-4 left-4 w-72 glass-panel rounded-xl p-4 shadow-2xl flex flex-col gap-3">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2">
        <span class="text-xs font-bold uppercase tracking-wider text-cyan-400">Selected Atom</span>
        <span id="selected-symbol" class="font-bold text-amber-400 text-sm">None</span>
      </div>

      <!-- PARTICLE INPUTS -->
      <div>
        <label class="text-[10px] font-semibold uppercase text-slate-400">Particles (P / N / E)</label>
        <div class="grid grid-cols-3 gap-2 mt-1">
          <input type="number" id="input-p" min="1" max="118" value="6" class="bg-slate-900 border border-slate-700 rounded p-1 text-center text-xs text-rose-400 font-bold outline-none">
          <input type="number" id="input-n" min="0" max="200" value="6" class="bg-slate-900 border border-slate-700 rounded p-1 text-center text-xs text-sky-400 font-bold outline-none">
          <input type="number" id="input-e" min="0" max="118" value="6" class="bg-slate-900 border border-slate-700 rounded p-1 text-center text-xs text-amber-400 font-bold outline-none">
        </div>
      </div>

      <!-- SPEED SLIDER -->
      <div>
        <div class="flex justify-between items-center text-[10px] uppercase text-slate-400 font-semibold mb-1">
          <span>Electron Speed</span>
          <span id="speed-val" class="text-cyan-400 font-bold">1.0x</span>
        </div>
        <input type="range" id="speed-slider" min="0" max="30" value="10" class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
      </div>

      <!-- VISUAL TOGGLES -->
      <div class="border-t border-slate-700 pt-3 flex flex-col gap-2">
        <label class="flex items-center justify-between text-xs cursor-pointer">
          <span class="text-slate-300">Show Subshell Orbitals</span>
          <input type="checkbox" id="toggle-orbitals" checked class="rounded accent-cyan-500">
        </label>
        <label class="flex items-center justify-between text-xs cursor-pointer">
          <span class="text-slate-300">Show Aufbau Panel</span>
          <input type="checkbox" id="toggle-aufbau" class="rounded accent-cyan-500">
        </label>
      </div>
    </div>

    <!-- AUFBAU PANEL -->
    <div id="aufbau-modal" class="absolute bottom-4 right-4 w-80 glass-panel rounded-xl p-4 shadow-2xl hidden">
      <div class="text-xs font-bold uppercase tracking-wider text-amber-400 mb-2 border-b border-slate-700 pb-1">
        Aufbau Electron Energy Diagram
      </div>
      <div id="aufbau-grid" class="flex flex-col-reverse gap-1.5 max-h-56 overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- PERIODIC TABLE MODAL -->
  <div id="pt-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center hidden">
    <div class="glass-panel rounded-2xl p-6 w-[95vw] max-w-5xl shadow-2xl relative border border-slate-700">
      <button id="btn-close-pt" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <h2 class="text-lg font-bold text-cyan-400 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-table-cells"></i> Select Element from Periodic Table
      </h2>

      <div id="pt-grid" class="grid grid-cols-18 gap-1 text-center text-xs font-bold"></div>
    </div>
  </div>

  <script>
    // Periodic Table Data
    const PT_ELEMENTS = [
      { z: 1, sym: "H", name: "Hydrogen", group: 1, row: 1 },
      { z: 2, sym: "He", name: "Helium", group: 18, row: 1 },
      { z: 3, sym: "Li", name: "Lithium", group: 1, row: 2 },
      { z: 4, sym: "Be", name: "Beryllium", group: 2, row: 2 },
      { z: 5, sym: "B", name: "Boron", group: 13, row: 2 },
      { z: 6, sym: "C", name: "Carbon", group: 14, row: 2 },
      { z: 7, sym: "N", name: "Nitrogen", group: 15, row: 2 },
      { z: 8, sym: "O", name: "Oxygen", group: 16, row: 2 },
      { z: 9, sym: "F", name: "Fluorine", group: 17, row: 2 },
      { z: 10, sym: "Ne", name: "Neon", group: 18, row: 2 },
      { z: 11, sym: "Na", name: "Sodium", group: 1, row: 3 },
      { z: 12, sym: "Mg", name: "Magnesium", group: 2, row: 3 },
      { z: 13, sym: "Al", name: "Aluminium", group: 13, row: 3 },
      { z: 14, sym: "Si", name: "Silicon", group: 14, row: 3 },
      { z: 15, sym: "P", name: "Phosphorus", group: 15, row: 3 },
      { z: 16, sym: "S", name: "Sulfur", group: 16, row: 3 },
      { z: 17, sym: "Cl", name: "Chlorine", group: 17, row: 3 },
      { z: 18, sym: "Ar", name: "Argon", group: 18, row: 3 }
    ];

    const ORBITAL_CAPS = [
      { name: "1s", cap: 2 }, { name: "2s", cap: 2 }, { name: "2p", cap: 6 },
      { name: "3s", cap: 2 }, { name: "3p", cap: 6 }, { name: "4s", cap: 2 },
      { name: "3d", cap: 10 }, { name: "4p", cap: 6 }
    ];

    let canvas, ctx;
    let atoms = [];
    let bonds = [];
    let selectedAtomId = null;
    let activeBondMode = null; // 'covalent' or 'ionic'
    let bondSourceId = null;

    let isPlaying = true;
    let animTime = 0;
    let speedMultiplier = 1.0;

    // Video Recording Variables
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    class Atom {
      constructor(x, y, p = 6, n = 6, e = 6) {
        this.id = Math.random().toString(36).substr(2, 9);
        this.x = x;
        this.y = y;
        this.protons = p;
        this.neutrons = n;
        this.electrons = e;
        this.radius = 32;
      }

      getSymbol() {
        let el = PT_ELEMENTS.find(item => item.z === this.protons);
        return el ? el.sym : `Z=${this.protons}`;
      }

      getShells() {
        let caps = [2, 8, 18, 32, 50];
        let rem = this.electrons;
        let res = [];
        for (let c of caps) {
          if (rem <= 0) break;
          let cnt = Math.min(rem, c);
          res.push(cnt);
          rem -= cnt;
        }
        return res;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById('atomCanvas');
      ctx = canvas.getContext('2d');

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Default Atom (Carbon)
      let defaultAtom = new Atom(canvas.width / 2, canvas.height / 2, 6, 6, 6);
      atoms.push(defaultAtom);
      selectedAtomId = defaultAtom.id;

      setupPeriodicTable();
      setupEventListeners();
      syncSidebar();

      // Start Animation Loop
      requestAnimationFrame(animLoop);
    });

    function resizeCanvas() {
      canvas.width = document.getElementById('workspace').clientWidth;
      canvas.height = document.getElementById('workspace').clientHeight;
    }

    function setupPeriodicTable() {
      const grid = document.getElementById('pt-grid');
      grid.className = "grid grid-cols-18 gap-1.5 p-2 bg-slate-900/90 rounded-xl border border-slate-800";
      grid.style.gridTemplateColumns = "repeat(18, minmax(0, 1fr))";

      // Fill Grid 18x7
      for (let r = 1; r <= 3; r++) {
        for (let g = 1; g <= 18; g++) {
          let el = PT_ELEMENTS.find(item => item.row === r && item.group === g);
          let cell = document.createElement('div');
          
          if (el) {
            cell.className = "pt-element p-2 rounded bg-slate-800 border border-slate-700 hover:bg-cyan-600/30 flex flex-col items-center justify-center";
            cell.innerHTML = `
              <span class="text-[9px] text-slate-400 font-normal">${el.z}</span>
              <span class="text-sm font-black text-amber-400">${el.sym}</span>
              <span class="text-[8px] text-slate-300 truncate w-full">${el.name}</span>
            `;
            cell.onclick = () => {
              let cur = atoms.find(a => a.id === selectedAtomId);
              if (cur) {
                cur.protons = el.z;
                cur.neutrons = el.z;
                cur.electrons = el.z;
              } else {
                let a = new Atom(canvas.width / 2, canvas.height / 2, el.z, el.z, el.z);
                atoms.push(a);
                selectedAtomId = a.id;
              }
              syncSidebar();
              document.getElementById('pt-modal').classList.add('hidden');
            };
          } else {
            cell.className = "p-2 opacity-0 pointer-events-none";
          }
          grid.appendChild(cell);
        }
      }
    }

    function setupEventListeners() {
      let isDragging = false;
      let dragAtom = null;

      canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        let clicked = atoms.find(a => Math.hypot(a.x - mx, a.y - my) < a.radius + 30);

        if (activeBondMode && clicked) {
          if (!bondSourceId) {
            bondSourceId = clicked.id;
          } else if (bondSourceId !== clicked.id) {
            bonds.push({ id1: bondSourceId, id2: clicked.id, type: activeBondMode });
            bondSourceId = null;
            activeBondMode = null;
            document.getElementById('btn-bond-covalent').classList.remove('bg-amber-500');
            document.getElementById('btn-bond-ionic').classList.remove('bg-pink-500');
          }
          return;
        }

        if (clicked) {
          selectedAtomId = clicked.id;
          dragAtom = clicked;
          isDragging = true;
          syncSidebar();
        } else {
          selectedAtomId = null;
        }
      });

      canvas.addEventListener('mousemove', (e) => {
        if (isDragging && dragAtom) {
          const rect = canvas.getBoundingClientRect();
          dragAtom.x = e.clientX - rect.left;
          dragAtom.y = e.clientY - rect.top;
        }
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
        dragAtom = null;
      });

      // Controls & Toggles
      document.getElementById('btn-open-pt').onclick = () => document.getElementById('pt-modal').classList.remove('hidden');
      document.getElementById('btn-close-pt').onclick = () => document.getElementById('pt-modal').classList.add('hidden');

      document.getElementById('btn-add-atom').onclick = () => {
        let a = new Atom(canvas.width / 2 + (Math.random() - 0.5) * 100, canvas.height / 2 + (Math.random() - 0.5) * 100, 1, 0, 1);
        atoms.push(a);
        selectedAtomId = a.id;
        syncSidebar();
      };

      document.getElementById('btn-bond-covalent').onclick = (e) => {
        activeBondMode = activeBondMode === 'covalent' ? null : 'covalent';
        bondSourceId = null;
        e.currentTarget.classList.toggle('bg-amber-500', activeBondMode === 'covalent');
        document.getElementById('btn-bond-ionic').classList.remove('bg-pink-500');
      };

      document.getElementById('btn-bond-ionic').onclick = (e) => {
        activeBondMode = activeBondMode === 'ionic' ? null : 'ionic';
        bondSourceId = null;
        e.currentTarget.classList.toggle('bg-pink-500', activeBondMode === 'ionic');
        document.getElementById('btn-bond-covalent').classList.remove('bg-amber-500');
      };

      document.getElementById('btn-play-pause').onclick = () => {
        isPlaying = !isPlaying;
        document.getElementById('play-icon').className = isPlaying ? "fa-solid fa-pause text-emerald-400" : "fa-solid fa-play text-emerald-400";
      };

      document.getElementById('speed-slider').oninput = (e) => {
        speedMultiplier = parseFloat(e.target.value) / 10;
        document.getElementById('speed-val').textContent = `${speedMultiplier.toFixed(1)}x`;
      };

      ['input-p', 'input-n', 'input-e'].forEach(id => {
        document.getElementById(id).oninput = () => {
          let cur = atoms.find(a => a.id === selectedAtomId);
          if (cur) {
            cur.protons = parseInt(document.getElementById('input-p').value) || 1;
            cur.neutrons = parseInt(document.getElementById('input-n').value) || 0;
            cur.electrons = parseInt(document.getElementById('input-e').value) || 0;
          }
        };
      });

      document.getElementById('toggle-aufbau').onchange = (e) => {
        document.getElementById('aufbau-modal').classList.toggle('hidden', !e.target.checked);
      };

      document.getElementById('btn-clear').onclick = () => {
        atoms = [];
        bonds = [];
        selectedAtomId = null;
      };

      document.getElementById('btn-export-png').onclick = exportPNG;
      document.getElementById('btn-record-video').onclick = toggleVideoRecording;
    }

    function syncSidebar() {
      let cur = atoms.find(a => a.id === selectedAtomId);
      if (!cur) return;
      document.getElementById('selected-symbol').textContent = `${cur.getSymbol()} (Z=${cur.protons})`;
      document.getElementById('input-p').value = cur.protons;
      document.getElementById('input-n').value = cur.neutrons;
      document.getElementById('input-e').value = cur.electrons;
    }

    function animLoop() {
      if (isPlaying) {
        animTime += 0.03 * speedMultiplier;
      }

      renderCanvas(ctx);
      updateAufbau();
      updateFormula();

      requestAnimationFrame(animLoop);
    }

    function renderCanvas(targetCtx = ctx, bgColor = null) {
      let w = targetCtx.canvas.width;
      let h = targetCtx.canvas.height;

      // Background
      if (bgColor === 'transparent') {
        targetCtx.clearRect(0, 0, w, h);
      } else {
        targetCtx.fillStyle = bgColor || '#090a10';
        targetCtx.fillRect(0, 0, w, h);
      }

      let showOrbitals = document.getElementById('toggle-orbitals').checked;

      // Render Bonds & Shared / Transferred Electrons
      for (let b of bonds) {
        let a1 = atoms.find(a => a.id === b.id1);
        let a2 = atoms.find(a => a.id === b.id2);
        if (!a1 || !a2) continue;

        let midX = (a1.x + a2.x) / 2;
        let midY = (a1.y + a2.y) / 2;
        let dist = Math.hypot(a2.x - a1.x, a2.y - a1.y);

        if (b.type === 'covalent') {
          // Covalent Bond Line
          targetCtx.beginPath();
          targetCtx.moveTo(a1.x, a1.y);
          targetCtx.lineTo(a2.x, a2.y);
          targetCtx.strokeStyle = '#f59e0b';
          targetCtx.lineWidth = 3;
          targetCtx.stroke();

          // Shared Figure-8 (Lemniscate) Animated Electrons
          let angle = Math.atan2(a2.y - a1.y, a2.x - a1.x);
          for (let i = 0; i < 2; i++) {
            let t = animTime * 2 + (i * Math.PI);
            let scale = dist / 2;
            let lx = (scale * Math.cos(t)) / (1 + Math.sin(t) * Math.sin(t));
            let ly = (scale * Math.sin(t) * Math.cos(t)) / (1 + Math.sin(t) * Math.sin(t));

            // Rotate figure-8 to match bond angle
            let rx = midX + lx * Math.cos(angle) - ly * Math.sin(angle);
            let ry = midY + lx * Math.sin(angle) + ly * Math.cos(angle);

            targetCtx.beginPath();
            targetCtx.arc(rx, ry, 6, 0, Math.PI * 2);
            targetCtx.fillStyle = '#f59e0b';
            targetCtx.shadowColor = '#f59e0b';
            targetCtx.shadowBlur = 10;
            targetCtx.fill();
            targetCtx.shadowBlur = 0;
          }
        } else if (b.type === 'ionic') {
          // Ionic Bond Dashed Lines & Electron Transfer
          targetCtx.beginPath();
          targetCtx.moveTo(a1.x, a1.y);
          targetCtx.lineTo(a2.x, a2.y);
          targetCtx.strokeStyle = '#ec4899';
          targetCtx.lineWidth = 2;
          targetCtx.setLineDash([6, 6]);
          targetCtx.stroke();
          targetCtx.setLineDash([]);

          // Transferring Electron
          let progress = (Math.sin(animTime * 3) + 1) / 2;
          let ex = a1.x + (a2.x - a1.x) * progress;
          let ey = a1.y + (a2.y - a1.y) * progress;

          targetCtx.beginPath();
          targetCtx.arc(ex, ey, 6, 0, Math.PI * 2);
          targetCtx.fillStyle = '#ec4899';
          targetCtx.shadowColor = '#ec4899';
          targetCtx.shadowBlur = 12;
          targetCtx.fill();
          targetCtx.shadowBlur = 0;
        }
      }

      // Render Atoms
      for (let a of atoms) {
        let isSelected = (a.id === selectedAtomId);
        let shells = a.getShells();

        // Orbit Rings & Electrons
        shells.forEach((cnt, idx) => {
          let r = a.radius + (idx + 1) * 30;

          targetCtx.beginPath();
          targetCtx.arc(a.x, a.y, r, 0, Math.PI * 2);
          targetCtx.strokeStyle = showOrbitals ? 'rgba(6, 182, 212, 0.4)' : 'rgba(255, 255, 255, 0.15)';
          targetCtx.lineWidth = 1.5;
          targetCtx.stroke();

          // Electrons Revolving
          for (let i = 0; i < cnt; i++) {
            let speed = (1 / (idx + 1)) * 0.8;
            let angle = (Math.PI * 2 / cnt) * i + (animTime * speed);
            let ex = a.x + r * Math.cos(angle);
            let ey = a.y + r * Math.sin(angle);

            targetCtx.beginPath();
            targetCtx.arc(ex, ey, 5.5, 0, Math.PI * 2);
            targetCtx.fillStyle = '#38bdf8';
            targetCtx.shadowColor = '#38bdf8';
            targetCtx.shadowBlur = 8;
            targetCtx.fill();
            targetCtx.shadowBlur = 0;
          }
        });

        // Nucleus
        targetCtx.beginPath();
        targetCtx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
        targetCtx.fillStyle = isSelected ? '#1e293b' : '#0f172a';
        targetCtx.strokeStyle = isSelected ? '#f59e0b' : '#38bdf8';
        targetCtx.lineWidth = isSelected ? 3 : 2;
        targetCtx.fill();
        targetCtx.stroke();

        // Nucleus Text
        targetCtx.fillStyle = '#f43f5e';
        targetCtx.font = 'bold 11px sans-serif';
        targetCtx.textAlign = 'center';
        targetCtx.fillText(`${a.protons}p⁺`, a.x, a.y - 3);

        targetCtx.fillStyle = '#38bdf8';
        targetCtx.fillText(`${a.neutrons}n⁰`, a.x, a.y + 11);
      }
    }

    function updateFormula() {
      if (atoms.length === 0) {
        document.getElementById('formula-badge').textContent = 'Formula: -';
        return;
      }
      let counts = {};
      atoms.forEach(a => {
        let sym = a.getSymbol();
        counts[sym] = (counts[sym] || 0) + 1;
      });
      let str = Object.entries(counts).map(([s, c]) => `${s}${c > 1 ? c : ''}`).join('');
      document.getElementById('formula-badge').textContent = `Formula: ${str}`;
    }

    function updateAufbau() {
      let cur = atoms.find(a => a.id === selectedAtomId);
      let container = document.getElementById('aufbau-grid');
      container.innerHTML = '';
      if (!cur) return;

      let rem = cur.electrons;
      ORBITAL_CAPS.forEach(orb => {
        if (rem <= 0) return;
        let placed = Math.min(rem, orb.cap);
        rem -= placed;

        let row = document.createElement('div');
        row.className = 'flex items-center gap-2 text-xs';

        let label = document.createElement('div');
        label.className = 'w-8 text-right font-bold text-amber-400';
        label.textContent = orb.name;

        let boxes = document.createElement('div');
        boxes.className = 'flex gap-1';

        let numBoxes = orb.cap / 2;
        for (let b = 0; b < numBoxes; b++) {
          let box = document.createElement('div');
          box.className = 'w-6 h-6 border border-slate-700 bg-slate-900 rounded flex items-center justify-center text-cyan-400 font-bold text-[10px]';
          let eInBox = Math.min(placed - b * 2, 2);
          if (eInBox === 2) box.textContent = '↿⇂';
          else if (eInBox === 1) box.textContent = '↿';
          boxes.appendChild(box);
        }

        row.appendChild(label);
        row.appendChild(boxes);
        container.appendChild(row);
      });
    }

    function exportPNG() {
      let bg = document.getElementById('export-bg-select').value;
      let expCanvas = document.createElement('canvas');
      expCanvas.width = canvas.width;
      expCanvas.height = canvas.height;
      let expCtx = expCanvas.getContext('2d');

      renderCanvas(expCtx, bg);

      let link = document.createElement('a');
      link.download = 'atom-bonding-model.png';
      link.href = expCanvas.toDataURL('image/png');
      link.click();
    }

    // Canvas Video Recorder Engine
    function toggleVideoRecording() {
      if (!isRecording) {
        startVideoRecording();
      } else {
        stopVideoRecording();
      }
    }

    function startVideoRecording() {
      recordedChunks = [];
      let stream = canvas.captureStream(60); // 60 FPS
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        let blob = new Blob(recordedChunks, { type: 'video/webm' });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = 'atom-bonding-animation.webm';
        a.click();
      };

      mediaRecorder.start();
      isRecording = true;

      document.getElementById('rec-dot').classList.remove('hidden');
      document.getElementById('rec-icon').className = "fa-solid fa-square text-white";
      document.getElementById('rec-text').textContent = "Stop Recording";
    }

    function stopVideoRecording() {
      if (mediaRecorder) {
        mediaRecorder.stop();
      }
      isRecording = false;

      document.getElementById('rec-dot').classList.add('hidden');
      document.getElementById('rec-icon').className = "fa-solid fa-video";
      document.getElementById('rec-text').textContent = "Record Video";
    }
  </script>
</body>
</html>
